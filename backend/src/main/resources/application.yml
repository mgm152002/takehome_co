server:
  port: ${SERVER_PORT:5000}

spring:
  application:
    name: vehicle-search
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD}
    hikari:
      initialization-fail-timeout: -1

supabase:
  url: ${SUPABASE_URL}
  publishable-key: ${SUPABASE_PUBLISHABLE_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health
